# Increase transmission strength.
# https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Display — custom bongo cat screen
# https://zmk.dev/docs/config/displays
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# WPM tracking (drives the cat animation)
CONFIG_ZMK_WPM=y

# LVGL fonts used by custom_status_screen.c
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Enable LVGL label widget (not auto-selected when using custom screen)
CONFIG_LV_USE_LABEL=y

# Memory pool — must be set explicitly for custom screens
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# RGB Underglow
# https://zmk.dev/docs/config/underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Bluetooth
# https://zmk.dev/docs/config/system#bluetooth
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Debug
# https://zmk.dev/docs/config/system#logging
CONFIG_ZMK_USB_LOGGING=n

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Key Chatter
# https://zmk.dev/docs/features/debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
